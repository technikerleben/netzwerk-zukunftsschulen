<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netzwerk Zukunftsschulen – Arbeitstreffen</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root {
  /* Schieferblau */
  --col-slate-dark:  #2C3D4C;
  --col-slate:       #3E5668;
  --col-slate-mid:   #6A8599;
  --col-slate-pale:  #D0DCE6;
  --col-slate-ghost: #EEF3F7;
  /* Rostorange */
  --col-rust-dark:   #9E4E22;
  --col-rust:        #D97A4A;
  --col-rust-mid:    #EBA882;
  --col-rust-pale:   #F5DDD1;
  --col-rust-ghost:  #FBF0EB;
  /* Salbeigrün */
  --col-sage-dark:   #4D8B3F;
  --col-sage:        #7DBB6F;
  --col-sage-mid:    #A8D49D;
  --col-sage-pale:   #DDF0D8;
  --col-sage-ghost:  #F0FAF0;
  /* Semantisch */
  --col-warning:      #C17B00;
  --col-warning-pale: #FFF3CC;
  --col-warning-text: #5C4400;
  --col-error:        #C0392B;
  --col-error-pale:   #FDECEA;
  --col-error-text:   #7A1B14;
  /* Neutral */
  --col-bg:           #F5F4F1;
  --col-white:        #FFFFFF;
  --col-text:         #1E2A35;
  --col-muted:        #445460;
  --col-border:       #D4D0C8;
  --col-shadow:       rgba(44,61,76,0.14);
  --col-shadow-rust:  rgba(158,78,34,0.14);
  --col-shadow-sage:  rgba(77,139,63,0.14);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;
  background: linear-gradient(160deg, #F0EEE9 0%, #F5F4F1 55%, #EEF3F7 100%);
  background-attachment: fixed;
  color:var(--col-text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  line-height:1.65;
  font-size: 18px;
}
:focus-visible{outline:3px solid var(--col-slate);outline-offset:3px;border-radius:4px;}

/* ── GLOBAL FONT FLOOR ── */
label, p, span, li, td, th { font-size: max(0.9rem, inherit); }
textarea, input[type="text"], input[type="date"] {
  font-size: 1rem;
  font-family: inherit;
  border: 1.5px solid var(--col-border);
  border-radius: 8px;
  padding: 10px 14px;
  background: var(--col-white);
  color: var(--col-text);
  width: 100%;
  transition: border-color .15s, box-shadow .15s;
}
textarea:focus, input:focus {
  outline: none;
  border-color: var(--col-slate);
  box-shadow: 0 0 0 3px rgba(62,86,104,.15);
}

/* ── TIMER ── */
.timer-num{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.8rem;color:white;transition:color .3s;}
.timer-warn{color:#FFF3CC !important;}
.timer-over{animation:blink .7s infinite;}
.timer-pulse{animation:timerPulse 1s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes timerPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* ── NAV DOTS ── */
.phdot{
  width:10px;height:10px;border-radius:50%;
  background:rgba(255,255,255,.25);
  cursor:pointer;transition:all .25s;flex-shrink:0;
}
.phdot.active{
  background: var(--col-rust);
  transform: scale(1.5);
  box-shadow: 0 0 0 3px rgba(217,122,74,.35), 0 0 8px rgba(217,122,74,.5);
}
.phdot.done{
  background: var(--col-sage);
  box-shadow: 0 0 0 2px rgba(125,187,111,.3);
}

/* ── CARDS ── */
.card{
  background: white;
  border-radius: 14px;
  border: 1.5px solid rgba(208,220,230,.7);
  padding: 22px;
  box-shadow: 0 3px 12px var(--col-shadow), 0 1px 3px rgba(0,0,0,.06);
  transition: box-shadow .2s;
}
.card:hover { box-shadow: 0 6px 20px var(--col-shadow), 0 2px 5px rgba(0,0,0,.07); }

/* ── GROUP CARDS ── */
.grp-g1{
  background: linear-gradient(145deg, var(--col-sage-ghost) 0%, #E8F7E2 100%);
  border: 2px solid var(--col-sage-mid);
  box-shadow: 0 3px 14px var(--col-shadow-sage);
}
.grp-g2{
  background: linear-gradient(145deg, var(--col-rust-ghost) 0%, #F8EDE6 100%);
  border: 2px solid var(--col-rust-mid);
  box-shadow: 0 3px 14px var(--col-shadow-rust);
}
.grp-g3{
  background: linear-gradient(145deg, var(--col-slate-ghost) 0%, #E4EDF5 100%);
  border: 2px solid var(--col-slate-pale);
  box-shadow: 0 3px 14px var(--col-shadow);
}

/* ── NOTE DEL BUTTON ── */
.note-del{background:none;border:none;cursor:pointer;color:var(--col-muted);font-size:1.1rem;padding:0;flex-shrink:0;line-height:1;opacity:.55;transition:opacity .15s;}
.note-del:hover{opacity:1;color:var(--col-error);}

/* ── NEW CARD FLASH ── */
@keyframes cardFlash{
  0%  {box-shadow:0 0 0 0 rgba(217,122,74,.7),0 3px 12px rgba(44,61,76,.1);}
  40% {box-shadow:0 0 0 10px rgba(217,122,74,0),0 8px 24px rgba(44,61,76,.18);}
  100%{box-shadow:0 0 0 0 rgba(217,122,74,0),0 3px 12px rgba(44,61,76,.1);}
}
.card-new{animation:cardFlash .75s ease-out both;}

/* ── PRESENTATION MODE ── */
body.pres{font-size:20px;line-height:1.75;}
body.pres .edit-only{display:none!important;}
body.pres #main-area{font-size:1em;}
body.pres .pres-big{font-size:1.35em!important;}
body.pres .card{padding:32px;}
body.pres label{font-size:.95rem!important;}
body.pres p{font-size:.95rem!important;}
body.pres textarea{font-size:1.05rem;line-height:1.7;}
body.pres .phase-kicker{font-size:.9rem!important;}
body.pres .phase-h2{font-size:2.6rem!important;letter-spacing:-.01em;}
body.pres .phase-sub{font-size:1.1rem!important;}
body.pres .pres-show{display:flex!important;}
.pres-show{display:none;}
body.pres .note-del{display:none;}

/* ── PHASE TRANSITION ── */
.phase-in{animation:phaseIn .4s cubic-bezier(.22,.68,0,1.15) both;}
@keyframes phaseIn{
  from{opacity:0;transform:translateY(14px) scale(.985);}
  to  {opacity:1;transform:translateY(0)    scale(1);}
}

/* ── PRINT ── */
@media print{
  #app-header,#app-nav-bar,#app-bottom-nav{display:none!important;}
  #main-area{padding:0!important;}
  body{background:white;}
  .no-print{display:none!important;}
  .print-sec{page-break-inside:avoid;margin-bottom:18pt;}
}

/* scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--col-slate-pale);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--col-slate-mid)}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════ HEADER -->
<header id="app-header" style="background:linear-gradient(120deg,#1E2E3B 0%,#2C3D4C 45%,#3E5668 100%);border-bottom:3px solid var(--col-rust-dark);color:white;padding:10px 24px;flex-shrink:0;box-shadow:0 3px 14px rgba(0,0,0,.25);">
  <div style="max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
    <!-- Title block -->
    <div style="flex:1;min-width:180px;">
      <div style="font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--col-rust-mid);margin-bottom:3px;font-weight:600;">HBG Dortmund · Netzwerk Zukunftsschulen</div>
      <h1 id="hdr-title" style="font-size:1.08rem;font-weight:700;line-height:1.25;"></h1>
    </div>

    <!-- Timer block -->
    <div style="display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,.15) 100%);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:9px 16px;">
      <div>
        <div style="font-size:.65rem;color:var(--col-rust-mid);text-transform:uppercase;letter-spacing:.1em;margin-bottom:1px;font-weight:600;">Verbleibend</div>
        <div class="timer-num" id="timer-disp">—:——</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:5px;">
        <button id="btn-timer-toggle" onclick="timerToggle()"
          style="background:linear-gradient(135deg,#B55A28,#9E4E22);color:white;border:none;border-radius:7px;padding:6px 12px;font-size:.78rem;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:0 2px 6px rgba(158,78,34,.4);">
          ▶ Start
        </button>
        <button onclick="timerReset()"
          style="background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:white;border-radius:7px;padding:5px 12px;font-size:.72rem;cursor:pointer;">
          ↺ Reset
        </button>
      </div>
    </div>

    <!-- Presentation toggle -->
    <button id="btn-pres" onclick="presToggle()"
      style="background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.22);color:white;border-radius:9px;padding:9px 15px;font-size:.85rem;cursor:pointer;white-space:nowrap;transition:background .2s,border-color .2s;font-weight:500;">
      🖥 Präsentationsmodus
    </button>
    <!-- Fullscreen toggle -->
    <button id="btn-fs" onclick="fsToggle()" title="Vollbild"
      style="background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.22);color:white;border-radius:9px;padding:9px 13px;font-size:1.05rem;cursor:pointer;line-height:1;transition:background .2s;">
      ⛶
    </button>
  </div>
</header>

<!-- ═══════════════════════════════════════════════════════ PHASE NAV -->
<div id="app-nav-bar" style="background:linear-gradient(90deg,#1E2E3B 0%,#2C3D4C 50%,#1E2E3B 100%);padding:8px 24px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.06);">
  <div style="max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:0;justify-content:center;" id="dot-row"></div>
</div>

<!-- ═══════════════════════════════════════════════════════ MAIN -->
<main id="main-area" style="flex:1;overflow-y:auto;padding:24px 24px 8px;"></main>

<!-- ═══════════════════════════════════════════════════════ BOTTOM NAV -->
<nav id="app-bottom-nav" class="no-print" style="background:linear-gradient(180deg,#ffffff 0%,#F8F7F4 100%);border-top:2px solid var(--col-border);padding:11px 24px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;box-shadow:0 -2px 10px rgba(44,61,76,.07);">
  <button onclick="prevPhase()" id="btn-prev"
    style="background:linear-gradient(135deg,#F5F4F1,#EEF3F7);border:1.5px solid var(--col-border);color:var(--col-text);border-radius:9px;padding:10px 22px;font-size:.92rem;font-weight:600;cursor:pointer;min-width:44px;min-height:44px;transition:box-shadow .15s;">
    ← Zurück
  </button>
  <span id="nav-label" style="font-size:.87rem;color:var(--col-muted);text-align:center;"></span>
  <button onclick="nextPhase()" id="btn-next"
    style="background:linear-gradient(135deg,#B55A28,#9E4E22);color:white;border:none;border-radius:9px;padding:10px 24px;font-size:.92rem;font-weight:600;cursor:pointer;min-width:44px;min-height:44px;box-shadow:0 3px 10px rgba(158,78,34,.35);transition:box-shadow .15s;">
    Weiter →
  </button>
</nav>

<script>
// ═══════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════
const SK = 'mpk-at-v2';

const PHASES = [
  { id:0, num:'',   title:'Übersicht',                       sub:'Arbeitstreffen · 90 Minuten',                   secs:0      },
  { id:1, num:'01', title:'Einstieg & Zielklärung',           sub:'Format festlegen · Rollen klären',               secs:10*60 },
  { id:2, num:'02', title:'Gemeinsame Sammlung',               sub:'Was wurde getestet?',                            secs:15*60 },
  { id:3, num:'03', title:'Auswertung in Gruppen',             sub:'Chancen · Stolperstellen · Perspektiven',        secs:25*60 },
  { id:4, num:'04', title:'Verdichtung: Die Botschaft',        sub:'3–5 Kernaussagen für die anderen Schulen',       secs:15*60 },
  { id:5, num:'05', title:'Präsentationsentwurf erstellen',    sub:'Folieninhalte erarbeiten',                       secs:20*60 },
  { id:6, num:'06', title:'Abschluss & Aufgabenverteilung',    sub:'Wer macht was bis wann?',                        secs:5*60  },
  { id:7, num:'',   title:'Export',                           sub:'Ergebnisse sichern & teilen',                    secs:0     },
];

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
let S = {
  cur: 0,
  pres: false,
  done: [],
  d: {
    p1: { fmt:'folien', mod:'', dok:'' },
    p2: { notes:[] },
    p3: { g1:{aus:'',bsp:''}, g2:{aus:'',bsp:''}, g3:{aus:'',bsp:''} },
    p4: { frage:'', versucht:'', bewaehrt:'', schwer:'', next:'' },
    p5: { f1:'', f2:'', f3:'', f4:'', f5:'', f6:'' },
    p6: { fehlt:'', mat:'', wer:'', dl:'' },
  }
};

(function(){
  try {
    const raw = localStorage.getItem(SK);
    if (raw) {
      const p = JSON.parse(raw);
      S = { ...S, ...p, d: mergeDeep(S.d, p.d || {}) };
    }
  } catch(e){}
})();

function mergeDeep(target, src) {
  const out = {...target};
  for (const k in src) {
    if (src[k] && typeof src[k] === 'object' && !Array.isArray(src[k])) out[k] = mergeDeep(target[k] || {}, src[k]);
    else out[k] = src[k];
  }
  return out;
}

function persist() { localStorage.setItem(SK, JSON.stringify(S)); }

function setField(obj, path, val) {
  const parts = path.split('.');
  let o = obj;
  for (let i=0;i<parts.length-1;i++) o = o[parts[i]];
  o[parts[parts.length-1]] = val;
}
function getField(obj, path) {
  return path.split('.').reduce((o,k)=> o&&o[k]!==undefined?o[k]:'', obj);
}

// ═══════════════════════════════════════════════════════════════
// TIMER
// ═══════════════════════════════════════════════════════════════
let tSecs = 0, tRunning = false, tInterval = null;

function timerSet(secs) {
  clearInterval(tInterval); tRunning = false;
  tSecs = secs;
  timerDraw();
  btn('btn-timer-toggle').textContent = '▶ Start';
}
function timerDraw() {
  const m = String(Math.floor(tSecs/60)).padStart(2,'0');
  const s = String(tSecs%60).padStart(2,'0');
  const el = ge('timer-disp');
  el.textContent = tSecs > 0 ? `${m}:${s}` : '00:00';
  el.classList.remove('timer-warn','timer-over','timer-pulse');
  if (tSecs <= 60 && tSecs > 0) { el.classList.add('timer-warn'); el.classList.add('timer-pulse'); }
  if (tSecs <= 0) el.classList.add('timer-over');
}
function timerToggle() {
  if (tRunning) {
    clearInterval(tInterval); tRunning = false;
    btn('btn-timer-toggle').textContent = '▶ Fortsetzen';
  } else {
    if (tSecs <= 0) return;
    tRunning = true;
    btn('btn-timer-toggle').textContent = '⏸ Pause';
    tInterval = setInterval(() => {
      tSecs--;
      timerDraw();
      if (tSecs <= 0) {
        clearInterval(tInterval); tRunning = false;
        btn('btn-timer-toggle').textContent = '▶ Start';
        beep();
      }
    }, 1000);
  }
}
function timerReset() {
  clearInterval(tInterval); tRunning = false;
  tSecs = PHASES[S.cur].secs;
  timerDraw();
  btn('btn-timer-toggle').textContent = '▶ Start';
}
function beep() {
  try {
    const ctx = new AudioContext();
    [0,.15,.3].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = t===0?880:t===.15?660:440;
      g.gain.setValueAtTime(.25, ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+t+.3);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+.35);
    });
  } catch(e){}
}

// ═══════════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════════
function goTo(id) {
  if (id > S.cur && !S.done.includes(S.cur)) S.done.push(S.cur);
  S.cur = id;
  persist();
  timerSet(PHASES[id].secs);
  updateNav();
  render();
  ge('main-area').scrollTop = 0;
}
function nextPhase() { if (S.cur<7) goTo(S.cur+1); }
function prevPhase() { if (S.cur>0) goTo(S.cur-1); }

function updateNav() {
  const p = PHASES[S.cur];
  ge('hdr-title').textContent = S.cur===0
    ? 'Arbeitstreffen – Vorbereitung Abschlusspräsentation'
    : S.cur===7 ? 'Ergebnisse exportieren'
    : `Phase ${p.num}: ${p.title}`;

  ge('btn-prev').disabled = S.cur===0;
  ge('btn-next').textContent = S.cur===6 ? 'Zum Export →' : S.cur===7 ? '—' : 'Weiter →';
  ge('btn-next').disabled = S.cur===7;
  ge('nav-label').textContent = S.cur===0 ? 'Übersicht' : S.cur===7 ? 'Export' : `Phase ${S.cur} von 6  ·  ${formatTime(PHASES[S.cur].secs)}`;

  // Dots
  const row = ge('dot-row');
  row.innerHTML = '';
  PHASES.forEach((ph, i) => {
    if (i === 0 || i === 7) return; // skip overview & export from dots
    const dot = mk('span');
    dot.className = 'phdot' + (i===S.cur?' active':S.done.includes(i)?' done':'');
    dot.title = `Phase ${ph.num}: ${ph.title} (${formatTime(ph.secs)})`;
    dot.onclick = () => goTo(i);
    // connector line
    if (i > 1) {
      const line = mk('div');
      line.style.cssText = 'height:2px;background:rgba(255,255,255,.15);width:28px;flex-shrink:0;';
      row.appendChild(line);
    }
    row.appendChild(dot);
  });
}

function formatTime(secs) {
  if (!secs) return '—';
  return `${Math.floor(secs/60)} min`;
}

// ═══════════════════════════════════════════════════════════════
// PRESENTATION MODE
// ═══════════════════════════════════════════════════════════════
function presToggle() {
  S.pres = !S.pres;
  document.body.classList.toggle('pres', S.pres);
  const b = ge('btn-pres');
  b.textContent = S.pres ? '✏️ Bearbeitungsmodus' : '🖥 Präsentationsmodus';
  b.style.background = S.pres ? 'var(--col-rust-dark)' : 'rgba(255,255,255,.12)';
}

// ═══════════════════════════════════════════════════════════════
// FULLSCREEN
// ═══════════════════════════════════════════════════════════════
function fsToggle() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
}
document.addEventListener('fullscreenchange', () => {
  const b = ge('btn-fs');
  if (!b) return;
  const inFs = !!document.fullscreenElement;
  b.textContent = inFs ? '✕' : '⛶';
  b.title = inFs ? 'Vollbild beenden' : 'Vollbild';
  b.style.background = inFs ? 'var(--col-rust-dark)' : 'rgba(255,255,255,.12)';
});

// ═══════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════
const ge = id => document.getElementById(id);
const mk = tag => document.createElement(tag);
const btn = id => ge(id);

function phaseHeader(numLabel, title, sub, timeStr, accent) {
  const grads = {
    slate:   'linear-gradient(120deg,#1E2E3B 0%,#2C3D4C 50%,#3E5668 100%)',
    rust:    'linear-gradient(120deg,#7A3518 0%,#9E4E22 50%,#C06030 100%)',
    sage:    'linear-gradient(120deg,#375E2C 0%,#4D8B3F 50%,#68A857 100%)',
    warning: 'linear-gradient(120deg,#8A5800 0%,#C17B00 50%,#D99000 100%)',
  };
  const shadows = {
    slate:'rgba(44,61,76,.3)',rust:'rgba(158,78,34,.3)',sage:'rgba(77,139,63,.3)',warning:'rgba(193,123,0,.25)'
  };
  const grad = grads[accent]||grads.slate;
  const shad = shadows[accent]||shadows.slate;
  const el = mk('div');
  el.style.cssText = `background:${grad};color:white;border-radius:16px;padding:22px 30px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;box-shadow:0 5px 20px ${shad};position:relative;overflow:hidden;`;
  // decorative circle
  el.innerHTML = `
    <div style="position:absolute;top:-25px;right:60px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.05);pointer-events:none;"></div>
    <div>
      <div class="phase-kicker" style="font-size:.75rem;text-transform:uppercase;letter-spacing:.11em;opacity:.75;margin-bottom:5px;font-weight:600;">${numLabel}</div>
      <h2 class="phase-h2" style="font-size:1.6rem;font-weight:800;line-height:1.15;">${title}</h2>
      <p class="phase-sub" style="font-size:.9rem;opacity:.85;margin-top:5px;">${sub}</p>
    </div>
    ${timeStr ? `<div style="background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:12px 20px;text-align:center;flex-shrink:0;">
      <div style="font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;opacity:.8;font-weight:600;">Dauer</div>
      <div style="font-size:1.7rem;font-weight:800;letter-spacing:-.02em;">⏱ ${timeStr}</div>
    </div>` : ''}
  `;
  return el;
}

function fieldGroup(labelText, path, placeholder, rows=4, hint='') {
  const wrap = mk('div');
  wrap.style.marginBottom = '16px';
  const val = getField(S.d, path);
  wrap.innerHTML = `
    <label style="display:block;font-weight:600;font-size:.88rem;color:var(--col-text);margin-bottom:5px;">${labelText}</label>
    ${hint ? `<p style="font-size:.78rem;color:var(--col-muted);margin-bottom:5px;">${hint}</p>` : ''}
    <textarea rows="${rows}" placeholder="${placeholder}" style="resize:vertical;">${val}</textarea>
  `;
  wrap.querySelector('textarea').addEventListener('input', function() {
    setField(S.d, path, this.value); persist();
  });
  return wrap;
}

function renderCards() {
  const board = ge('card-board');
  const empty = ge('card-empty');
  const countEl = ge('card-count');
  if (!board) return;

  board.innerHTML = '';
  const notes = S.d.p2.notes;
  if (countEl) countEl.textContent = notes.length === 0 ? '' : `${notes.length} Karte${notes.length===1?'':'n'}`;
  if (empty) empty.style.display = notes.length === 0 ? 'block' : 'none';

  notes.forEach((note, idx) => {
    const col = CARD_COLORS[idx % CARD_COLORS.length];
    const card = mk('div');
    card.style.cssText = `background:${col.bg};border:1.5px solid ${col.border};border-radius:14px;overflow:hidden;box-shadow:0 3px 12px rgba(44,61,76,.1),0 1px 4px rgba(0,0,0,.06);display:flex;flex-direction:column;transition:box-shadow .2s;`;

    // Gradient header strip
    const strip = mk('div');
    strip.style.cssText = `background:${col.grad};color:${col.stripText};padding:10px 15px;display:flex;align-items:center;justify-content:space-between;`;
    strip.innerHTML = `
      <span style="font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;opacity:.95;">Karte ${idx+1}</span>
      <button class="note-del" onclick="cardDel('${note.id}')" title="Karte löschen"
        style="background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);border-radius:6px;width:26px;height:26px;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;color:white;flex-shrink:0;opacity:1;">×</button>
    `;
    card.appendChild(strip);

    // Fields container
    const body = mk('div');
    body.style.cssText = 'padding:14px 15px;display:flex;flex-direction:column;gap:11px;';

    [
      {key:'lerngruppe',  label:'📚 Lerngruppe / Jahrgang / Fach', ph:'z.B. Klasse 8a, Fach Technik'},
      {key:'methode',     label:'🔬 Prüfungsmethode',               ph:'z.B. Portfolio, Lernprodukt, kompetenzorientierter Test'},
      {key:'ziel',        label:'🎯 Zielsetzung',                   ph:'Warum wurde diese Methode erprobt?'},
      {key:'sonstiges',   label:'💬 Sonstiges / Materialien',       ph:'Besonderheiten, genutzte Materialien, Aufgabenformate…'},
      {key:'fbLehrkraft', label:'🧑‍🏫 Feedback der Lehrkraft',      ph:'Eigene Einschätzung, Beobachtungen, Konsequenzen…'},
      {key:'fbSuS',       label:'🧑‍🎓 Feedback der SuS',             ph:'Rückmeldungen, Zitate, typische Reaktionen…'},
    ].forEach(f => {
      const wrap = mk('div');
      const lbl = mk('label');
      lbl.style.cssText = `display:block;font-size:.8rem;font-weight:700;color:${col.accent};margin-bottom:4px;`;
      lbl.textContent = f.label;
      const inp = mk('textarea');
      inp.rows = f.key==='sonstiges' ? 2 : 1;
      inp.placeholder = f.ph;
      inp.value = note[f.key]||'';
      inp.style.cssText = `resize:none;border:1.5px solid ${col.border};border-radius:7px;padding:8px 11px;font-size:.9rem;font-family:inherit;background:rgba(255,255,255,.8);color:var(--col-text);width:100%;line-height:1.45;transition:border-color .15s,box-shadow .15s;`;
      inp.addEventListener('focus', function(){ this.style.borderColor=col.accent; this.style.boxShadow=`0 0 0 3px ${col.border}55`; });
      inp.addEventListener('blur',  function(){ this.style.borderColor=col.border; this.style.boxShadow='none'; });
      inp.addEventListener('input', function() {
        const n = S.d.p2.notes.find(n=>n.id===note.id);
        if (n) { n[f.key] = this.value; persist(); }
        this.style.height='auto'; this.style.height=this.scrollHeight+'px';
      });
      setTimeout(()=>{ inp.style.height='auto'; inp.style.height=inp.scrollHeight+'px'; },0);
      wrap.appendChild(lbl);
      wrap.appendChild(inp);
      body.appendChild(wrap);
    });

    card.appendChild(body);
    board.appendChild(card);
  });
}

window.cardAdd = function() {
  const id = Date.now().toString(36)+Math.random().toString(36).slice(2,5);

  persist();
  renderCards();
  // scroll to new card + flash animation
  setTimeout(() => {
    const board = ge('card-board');
    const last = board?.lastElementChild;
    if (last) {
      last.scrollIntoView({behavior:'smooth',block:'center'});
      last.classList.add('card-new');
    }

};
window.cardDel = function(id) {
  S.d.p2.notes = S.d.p2.notes.filter(n=>n.id!==id); persist(); renderCards();

      body{font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;color:#1E2A35;margin:0;padding:0;}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

const GROUPS = [
  {id:'g1',icon:'✅',title:'Gruppe 1: Chancen & Gelungenes',
   desc:'Was hat gut funktioniert? Lernzuwachs, Motivation, Transparenz, bessere Kompetenzorientierung?',
   headCol:'var(--col-sage-dark)',cls:'grp-g1',pathPre:'p3.g1'},
  {id:'g2',icon:'⚠️',title:'Gruppe 2: Stolperstellen & offene Fragen',
   desc:'Was war schwierig? Organisatorische, rechtliche, technische oder bewertungsbezogene Probleme?',
   headCol:'var(--col-rust-dark)',cls:'grp-g2',pathPre:'p3.g2'},
  {id:'g3',icon:'👁',title:'Gruppe 3: Schüler:innen- & Lehrkräfteperspektive',
   desc:'Wie haben SuS reagiert? Was haben Kolleg:innen beobachtet? Zitate, Rückmeldungen, typische Situationen?',
   headCol:'var(--col-slate)',cls:'grp-g3',pathPre:'p3.g3'},
];

function renderP3(c) {
  c.appendChild(phaseHeader('Phase 3 von 6','Auswertung in drei Gruppen','Jede Gruppe bearbeitet einen festen Fokus. Maximal 5 Kernaussagen + konkrete Beispiele.','25 min','sage'));

  // Group focus cards (always visible, big in pres mode)
  const grid = mk('div');
  grid.style.cssText = 'display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px;';
  GROUPS.forEach(g => {
    const el = mk('div');
    el.className = `card ${g.cls}`;
    el.innerHTML = `
      <div style="font-size:1.8rem;margin-bottom:8px;">${g.icon}</div>
      <h3 style="font-weight:700;font-size:.95rem;color:${g.headCol};margin-bottom:8px;">${g.title}</h3>
      <p style="font-size:.82rem;color:var(--col-muted);line-height:1.55;margin-bottom:14px;">${g.desc}</p>
      <div style="background:rgba(255,255,255,.7);border-radius:8px;padding:10px 12px;font-size:.78rem;color:var(--col-muted);">
        <strong>Aufgabe:</strong> Max. 5 Kernaussagen formulieren + konkrete Beispiele ergänzen
      </div>
    `;
    grid.appendChild(el);
  });
  c.appendChild(grid);

  // Results section
  const sec = mk('div');
  sec.innerHTML = `<h3 style="font-size:1rem;font-weight:700;margin-bottom:16px;color:var(--col-text);border-bottom:2px solid var(--col-border);padding-bottom:8px;">📥 Ergebnisse der Gruppenarbeit eintragen</h3>`;
  GROUPS.forEach(g => {
    const gc = mk('div');
    gc.className = 'card';
    gc.style.marginBottom = '16px';
    const title = mk('h4');
    title.style.cssText = `font-weight:700;margin-bottom:14px;color:${g.headCol};font-size:.95rem;`;
    title.textContent = `${g.icon} ${g.title}`;
    gc.appendChild(title);
    gc.appendChild(fieldGroup('Kernaussagen (max. 5)', `${g.pathPre}.aus`, '1. …\n2. …\n3. …\n4. …\n5. …', 5, 'Eine Aussage pro Zeile'));
    gc.appendChild(fieldGroup('Konkrete Beispiele & Beobachtungen', `${g.pathPre}.bsp`, 'Situationen, Zitate, Materialhinweise…', 4));
    sec.appendChild(gc);
  });
  c.appendChild(sec);
}

function renderP4(c) {
  c.appendChild(phaseHeader('Phase 4 von 6','Verdichtung: Was ist die Botschaft?','Ergebnisse zusammenführen – was nehmen die anderen Schulen mit?','15 min','slate'));

  const lf = mk('div');
  lf.style.cssText = 'background:linear-gradient(135deg,#EEF3F7,#E4EDF5);border-left:5px solid var(--col-slate);border-radius:0 14px 14px 0;padding:16px 22px;margin-bottom:24px;box-shadow:0 2px 8px rgba(44,61,76,.09);';
  lf.innerHTML = `<p class="pres-big" style="font-size:.98rem;font-weight:600;color:var(--col-slate-dark);">💬 Leitfrage: Welche drei bis fünf Aussagen sollen die anderen Schulen unbedingt mitnehmen?</p>`;
  c.appendChild(lf);

  const card = mk('div');
  card.className = 'card';
  card.innerHTML = `<h3 style="font-weight:700;font-size:.95rem;margin-bottom:16px;">📐 Struktur der Botschaft</h3>`;
  [
    {path:'p4.frage',    label:'1 · Unsere Ausgangsfrage',                      ph:'Was war die ursprüngliche Frage oder Herausforderung?',rows:2},
    {path:'p4.versucht', label:'2 · Das haben wir ausprobiert',                 ph:'Welche Methoden, Formate und Ansätze haben wir erprobt?',rows:3},
    {path:'p4.bewaehrt', label:'3 · Das hat sich bewährt',                      ph:'Was hat gut funktioniert? Was würden wir wieder machen?',rows:3},
    {path:'p4.schwer',   label:'4 · Das war schwierig',                         ph:'Was lief nicht wie geplant? Wo braucht es noch Lösungen?',rows:3},
    {path:'p4.next',     label:'5 · Daraus ergeben sich unsere nächsten Schritte', ph:'Was planen wir als Konsequenz? Welche Entscheidungen sind offen?',rows:3},
  ].forEach(f => card.appendChild(fieldGroup(f.label, f.path, f.ph, f.rows)));
  c.appendChild(card);
}

// PHASE 5 – PRÄSENTATIONSENTWURF
// ═══════════════════════════════════════════════════════════════
function renderP5(c) {
  c.appendChild(phaseHeader('Phase 5 von 6','Präsentationsentwurf erstellen','Folieninhalte erarbeiten – das Layout wird separat aufbereitet.','20 min','rust'));

  // Pre-fill from Phase 4 if p5 fields are still empty
  const MAP = [
    ['p5.f1','p4.frage'],
    ['p5.f2','p4.versucht'],
    ['p5.f3','p4.bewaehrt'],
    ['p5.f4','p4.schwer'],
    ['p5.f5','p4.next'],
  ];
  let anyPrefilled = false;
  MAP.forEach(([dst, src]) => {
    const srcVal = getField(S.d, src);
    const dstVal = getField(S.d, dst);
    if (!dstVal && srcVal) {
      setField(S.d, dst, srcVal);
      anyPrefilled = true;
    }
  });
  if (anyPrefilled) persist();

  // Info banner
  const note = mk('div');
  note.style.cssText = 'border-radius:10px;padding:12px 18px;font-size:.88rem;margin-bottom:20px;display:flex;gap:12px;align-items:flex-start;';
  if (anyPrefilled) {
    note.style.cssText += 'background:linear-gradient(135deg,#EAF6E6,#DDF0D8);border:1px solid #A8D49D;color:#2C5A24;';
    note.innerHTML = '<span style="font-size:1.3rem;flex-shrink:0;">✅</span><div><strong>Aus Phase 4 übernommen:</strong> Die Folien 1–5 wurden mit deinen verdichteten Aussagen vorbefüllt. Du kannst sie hier direkt bearbeiten und ergänzen.</div>';
  } else {
    note.style.cssText += 'background:linear-gradient(135deg,#FFF8E1,#FFF3CC);border:1px solid #D4A800;color:var(--col-warning-text);';
    note.innerHTML = '<span style="font-size:1.3rem;flex-shrink:0;">📌</span><div><strong>Hinweis:</strong> Hier werden die Textinhalte für die Folien gesammelt. Das finale Design wird separat aufbereitet.</div>';
  }
  c.appendChild(note);

  const grid = mk('div');
  grid.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:18px;';

  const FOLIE_SRC = ['p4.frage','p4.versucht','p4.bewaehrt','p4.schwer','p4.next', null];
  [
    {path:'p5.f1',label:'Folie 1 · Ausgangslage und Ziel',           ph:'Was war der Ausgangspunkt? Welches Ziel hatte die Erprobungsphase?',rows:4, srcKey:0},
    {path:'p5.f2',label:'Folie 2 · Getestete Prüfungsmethoden',      ph:'Welche Methoden wurden erprobt? Liste, kurze Beschreibungen…',rows:5,      srcKey:1},
    {path:'p5.f3',label:'Folie 3 · Ergebnisse und Beobachtungen',    ph:'Was wurde beobachtet? Welche Erkenntnisse gibt es?',rows:5,               srcKey:2},
    {path:'p5.f4',label:'Folie 4 · Stolperstellen',                  ph:'Was hat nicht funktioniert? Wo gab es Probleme?',rows:4,                  srcKey:3},
    {path:'p5.f5',label:'Folie 5 · Nächste Schritte',                ph:'Was plant die Schule als nächstes?',rows:4,                              srcKey:4},
    {path:'p5.f6',label:'Folie 6 · Materialbeispiele, Fotos, Zitate',ph:'Welche Materialien, Fotos oder Schüler:innenzitate sollen gezeigt werden?',rows:4, srcKey:5},
  ].forEach(f => {
    const fc = mk('div');
    fc.className = 'card';
    fc.style.position = 'relative';
    // Badge wenn aus Phase 4 befüllt
    const srcPath = FOLIE_SRC[f.srcKey];
    const hasSrc = srcPath && getField(S.d, srcPath);
    if (hasSrc) {
      const badge = mk('div');
      badge.style.cssText = 'position:absolute;top:14px;right:14px;background:var(--col-sage-pale);color:var(--col-sage-dark);font-size:.7rem;font-weight:700;padding:2px 9px;border-radius:20px;border:1px solid var(--col-sage-mid);';
      badge.textContent = '← Phase 4';
      fc.appendChild(badge);
    }
    fc.appendChild(fieldGroup(f.label, f.path, f.ph, f.rows));
    grid.appendChild(fc);
  });
  c.appendChild(grid);
}

function renderP6(c) {
  c.appendChild(phaseHeader('Phase 6 von 6','Abschluss & Aufgabenverteilung','Was fehlt noch? Wer macht was bis wann?','5 min','sage'));

  const card = mk('div');
  card.className = 'card';
  card.style.marginBottom = '18px';
  [
    {path:'p6.fehlt', label:'❓ Was fehlt noch?',                    ph:'Inhaltliche Lücken, offene Entscheidungen, fehlende Materialien…', rows:3},
    {path:'p6.mat',   label:'📎 Wer ergänzt welche Materialien?',    ph:'Name: Aufgabe / Material\nName: Aufgabe / Material', rows:3},
    {path:'p6.wer',   label:'🎤 Wer spricht beim Abschlusstreffen?', ph:'Namen und ggf. Aufteilung der Präsentation…', rows:2},
  ].forEach(f => card.appendChild(fieldGroup(f.label, f.path, f.ph, f.rows)));

  // Deadline
  const dlw = mk('div'); dlw.style.marginBottom='8px';
  dlw.innerHTML = `<label style="display:block;font-weight:600;font-size:.88rem;margin-bottom:5px;">📅 Deadline: Wann ist die Endfassung fertig?</label>
    <input type="date" value="${S.d.p6.dl||''}" style="border:1.5px solid var(--col-border);border-radius:8px;padding:8px 14px;font-size:1rem;font-family:inherit;">`;
  dlw.querySelector('input').addEventListener('change', function() { S.d.p6.dl=this.value; persist(); });
  card.appendChild(dlw);
  c.appendChild(card);

  const cta = mk('div');
  cta.style.cssText = 'background:linear-gradient(135deg,#E6F5E2,#DDF0D8);border:2px solid var(--col-sage-mid);border-radius:16px;padding:26px;text-align:center;box-shadow:0 3px 14px rgba(77,139,63,.15);';
  cta.innerHTML = `
    <p style="font-size:1.1rem;font-weight:700;color:var(--col-sage-dark);margin-bottom:8px;">🎉 Arbeitstreffen abgeschlossen!</p>
    <p style="font-size:.88rem;color:var(--col-muted);margin-bottom:16px;">Jetzt alle Ergebnisse exportieren, um sie für das Netzwerktreffen zu teilen.</p>
    <button onclick="goTo(7)"
      style="background:linear-gradient(135deg,#5A9E4C,#4D8B3F);color:white;border:none;border-radius:9px;padding:13px 28px;font-size:.97rem;font-weight:700;cursor:pointer;box-shadow:0 3px 12px rgba(77,139,63,.35);">
      📤 Zum Export →
    </button>
  `;
  c.appendChild(cta);
}

function renderExport(c) {
  const hdr = mk('div');
  hdr.style.cssText = 'background:linear-gradient(120deg,#1E2E3B 0%,#2C3D4C 50%,#3E5668 100%);color:white;border-radius:16px;padding:24px 30px;margin-bottom:22px;box-shadow:0 4px 16px rgba(44,61,76,.25);';
  hdr.innerHTML = `<h2 style="font-size:1.5rem;font-weight:700;margin-bottom:4px;">📤 Ergebnisse exportieren</h2>
    <p style="opacity:.85;font-size:.88rem;">Alle Eingaben aus dem Arbeitstreffen in einem Dokument</p>`;
  c.appendChild(hdr);

  const btns = mk('div');
  btns.style.cssText = 'display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;';
  btns.innerHTML = `
    <button onclick="doPrint()"
      style="background:linear-gradient(135deg,#3E5668,#2C3D4C);color:white;border:none;border-radius:9px;padding:12px 24px;font-size:.92rem;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(44,61,76,.3);">
      🖨 Als PDF drucken
    </button>
    <button id="btn-copy" onclick="doCopy()"
      style="background:linear-gradient(135deg,#B55A28,#9E4E22);color:white;border:none;border-radius:9px;padding:12px 24px;font-size:.92rem;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(158,78,34,.3);">
      📋 Text kopieren
    </button>
    <button onclick="doReset()"
      style="background:var(--col-error-pale);color:var(--col-error-text);border:1px solid var(--col-error);border-radius:9px;padding:12px 18px;font-size:.88rem;cursor:pointer;">
      🗑 Zurücksetzen
    </button>
  `;
  c.appendChild(btns);

  const preview = mk('div');
  preview.id = 'export-body';
  preview.style.cssText = 'border:2px solid var(--col-border);border-radius:12px;overflow:hidden;';
  preview.innerHTML = buildExportMarkup();
  c.appendChild(preview);
}

function buildExportMarkup() {
  const d = S.d;
  const date = new Date().toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
  const fmtLabel = {
    'praes':    '📊 Nur Präsentation',
    'praes+tc': '📊 + 🗂 Präsentation & Taskcard',
    'andere':   `✏️ Anderes: ${d.p1.fmtOther||'–'}`,
  };
  const cardsSec = d.p2.notes.length === 0
    ? '<p style="color:#5A6A78;">Keine Karten eingetragen.</p>'
    : d.p2.notes.map((n,i) => `
        <div style="border:1px solid #D4D0C8;border-radius:8px;padding:12px 14px;margin-bottom:10px;background:white;">
          <div style="font-size:11px;font-weight:700;color:#5A6A78;margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em;">Karte ${i+1}</div>
          ${n.lerngruppe ? `<p><strong>📚 Lerngruppe:</strong> ${escHtml(n.lerngruppe)}</p>` : ''}
          ${n.methode    ? `<p><strong>🔬 Prüfungsmethode:</strong> ${escHtml(n.methode)}</p>` : ''}
          ${n.ziel       ? `<p><strong>🎯 Zielsetzung:</strong> ${escHtml(n.ziel)}</p>` : ''}
          ${n.sonstiges  ? `<p><strong>💬 Sonstiges:</strong> ${escHtml(n.sonstiges)}</p>` : ''}
          ${n.fbLehrkraft? `<p><strong>🧑‍🏫 Feedback Lehrkraft:</strong> ${escHtml(n.fbLehrkraft)}</p>` : ''}
          ${n.fbSuS      ? `<p><strong>🧑‍🎓 Feedback SuS:</strong> ${escHtml(n.fbSuS)}</p>` : ''}
        </div>`).join('');
  const fmtField = (label, val) => val ? `<p><strong>${label}</strong><br>${val.replace(/\n/g,'<br>')}</p>` : '';

  return `<div style="padding:28px;background:white;font-family:-apple-system,Helvetica,Arial,sans-serif;color:#1E2A35;font-size:14px;line-height:1.65;">
    <div style="border-bottom:3px solid #3E5668;padding-bottom:14px;margin-bottom:22px;">
      <div style="font-size:11px;color:#5A6A78;margin-bottom:3px;">HBG Dortmund · Netzwerk Zukunftsschulen</div>
      <h1 style="font-size:22px;font-weight:700;color:#2C3D4C;margin-bottom:3px;">Ergebnisse Arbeitstreffen</h1>
      <div style="font-size:12px;color:#5A6A78;">Datum: ${date}</div>
    </div>

    <div class="print-sec" style="background:#EEF3F7;border-radius:8px;padding:16px 18px;margin-bottom:16px;">
      <h2 style="font-size:14px;font-weight:700;color:#2C3D4C;margin-bottom:10px;">Phase 1 · Einstieg</h2>
      <p><strong>Format:</strong> ${fmtLabel[d.p1.fmt]||'–'}</p>
    </div>

    <div class="print-sec" style="background:#FBF0EB;border-radius:8px;padding:16px 18px;margin-bottom:16px;">
      <h2 style="font-size:14px;font-weight:700;color:#2C3D4C;margin-bottom:10px;">Phase 2 · Sammlung (${d.p2.notes.length} Karten)</h2>
      ${cardsSec}
    </div>

    <div class="print-sec" style="background:#F0FAF0;border-radius:8px;padding:16px 18px;margin-bottom:16px;">
      <h2 style="font-size:14px;font-weight:700;color:#2C3D4C;margin-bottom:12px;">Phase 3 · Gruppenauswertung</h2>
      ${GROUPS.map(g => `
        <div style="margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid #D4D0C8;">
          <p style="font-weight:700;margin-bottom:6px;">${g.icon} ${g.title}</p>
          ${d.p3[g.id].aus ? `<p><em>Kernaussagen:</em><br>${escHtml(d.p3[g.id].aus).replace(/\n/g,'<br>')}</p>` : ''}
          ${d.p3[g.id].bsp ? `<p style="margin-top:6px;"><em>Beispiele:</em><br>${escHtml(d.p3[g.id].bsp).replace(/\n/g,'<br>')}</p>` : ''}
        </div>`).join('')}
    </div>

    <div class="print-sec" style="background:#EEF3F7;border-radius:8px;padding:16px 18px;margin-bottom:16px;">
      <h2 style="font-size:14px;font-weight:700;color:#2C3D4C;margin-bottom:12px;">Phase 4 · Die Botschaft</h2>
      ${fmtField('1. Unsere Ausgangsfrage:', d.p4.frage)}
      ${fmtField('2. Das haben wir ausprobiert:', d.p4.versucht)}
      ${fmtField('3. Das hat sich bewährt:', d.p4.bewaehrt)}
      ${fmtField('4. Das war schwierig:', d.p4.schwer)}
      ${fmtField('5. Nächste Schritte:', d.p4.next)}
    </div>

    <div class="print-sec" style="background:#FBF0EB;border-radius:8px;padding:16px 18px;margin-bottom:16px;">
      <h2 style="font-size:14px;font-weight:700;color:#2C3D4C;margin-bottom:12px;">Phase 5 · Folieninhalte</h2>
      ${fmtField('Folie 1 – Ausgangslage:', d.p5.f1)}
      ${fmtField('Folie 2 – Methoden:', d.p5.f2)}
      ${fmtField('Folie 3 – Ergebnisse:', d.p5.f3)}
      ${fmtField('Folie 4 – Stolperstellen:', d.p5.f4)}
      ${fmtField('Folie 5 – Nächste Schritte:', d.p5.f5)}
      ${fmtField('Folie 6 – Materialbeispiele:', d.p5.f6)}
    </div>

    <div class="print-sec" style="background:#DDF0D8;border-radius:8px;padding:16px 18px;">
      <h2 style="font-size:14px;font-weight:700;color:#2C3D4C;margin-bottom:10px;">Phase 6 · Aufgabenverteilung</h2>
      <p><strong>Was fehlt noch:</strong><br>${d.p6.fehlt ? escHtml(d.p6.fehlt).replace(/\n/g,'<br>') : '–'}</p>
      <p style="margin-top:8px;"><strong>Materialien:</strong><br>${d.p6.mat ? escHtml(d.p6.mat).replace(/\n/g,'<br>') : '–'}</p>
      <p style="margin-top:8px;"><strong>Sprecher:innen:</strong> ${d.p6.wer ? escHtml(d.p6.wer) : '–'}</p>
      <p style="margin-top:8px;"><strong>Deadline Endfassung:</strong> ${d.p6.dl ? new Date(d.p6.dl+'T12:00:00').toLocaleDateString('de-DE') : '–'}</p>
    </div>
  </div>`;
}

window.doPrint = function() {
  const w = window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><title>MPK Arbeitstreffen</title>
    <style>body{margin:20px;font-family:-apple-system,Helvetica,Arial,sans-serif;} @page{margin:15mm;} .print-sec{page-break-inside:avoid;} h1,h2{color:#2C3D4C;} p{margin-bottom:6px;}</style>
    </head><body>${buildExportMarkup()}</body></html>`);
  w.document.close(); w.focus();
  setTimeout(() => { w.print(); w.close(); }, 500);
};

window.doCopy = function() {
  const d = S.d;
  const fmtLabel = {
    'praes':    'Nur Präsentation',
    'praes+tc': 'Präsentation & Taskcard',
    'andere':   `Anderes: ${d.p1.fmtOther||'–'}`,
  };
  const hr = '─'.repeat(56);
  const notesText = d.p2.notes.length === 0 ? '(keine Karten)' :
    d.p2.notes.map((n,i) => [
      `Karte ${i+1}:`,
      n.lerngruppe  ? `  Lerngruppe: ${n.lerngruppe}` : null,
      n.methode     ? `  Methode: ${n.methode}` : null,
      n.ziel        ? `  Ziel: ${n.ziel}` : null,
      n.sonstiges   ? `  Sonstiges: ${n.sonstiges}` : null,
      n.fbLehrkraft ? `  Feedback Lehrkraft: ${n.fbLehrkraft}` : null,
      n.fbSuS       ? `  Feedback SuS: ${n.fbSuS}` : null,
    ].filter(Boolean).join('\n')).join('\n\n');

  const t = [
    'ARBEITSTREFFEN – NETZWERK ZUKUNFTSSCHULEN',
    `HBG Dortmund  ·  ${new Date().toLocaleDateString('de-DE')}`,
    '═'.repeat(56),
    '',
    'PHASE 1 – EINSTIEG',
    `Format: ${fmtLabel[d.p1.fmt]||'–'}`,
    '',hr,
    `PHASE 2 – SAMMLUNG (${d.p2.notes.length} Karten)`,
    notesText || '(keine Karten)',
    '',hr,
    'PHASE 3 – GRUPPENAUSWERTUNG',
    '',
    '✅ Gruppe 1: Chancen & Gelungenes',
    `Kernaussagen:\n${d.p3.g1.aus||'–'}`,
    `Beispiele:\n${d.p3.g1.bsp||'–'}`,
    '',
    '⚠ Gruppe 2: Stolperstellen',
    `Kernaussagen:\n${d.p3.g2.aus||'–'}`,
    `Beispiele:\n${d.p3.g2.bsp||'–'}`,
    '',
    '👁 Gruppe 3: Perspektiven',
    `Kernaussagen:\n${d.p3.g3.aus||'–'}`,
    `Beispiele:\n${d.p3.g3.bsp||'–'}`,
    '',hr,
    'PHASE 4 – DIE BOTSCHAFT',
    `1. Ausgangsfrage: ${d.p4.frage||'–'}`,
    `2. Ausprobiert: ${d.p4.versucht||'–'}`,
    `3. Bewährt: ${d.p4.bewaehrt||'–'}`,
    `4. Schwierig: ${d.p4.schwer||'–'}`,
    `5. Nächste Schritte: ${d.p4.next||'–'}`,
    '',hr,
    'PHASE 5 – FOLIENINHALTE',
    `Folie 1 – Ausgangslage: ${d.p5.f1||'–'}`,
    `Folie 2 – Methoden: ${d.p5.f2||'–'}`,
    `Folie 3 – Ergebnisse: ${d.p5.f3||'–'}`,
    `Folie 4 – Stolperstellen: ${d.p5.f4||'–'}`,
    `Folie 5 – Nächste Schritte: ${d.p5.f5||'–'}`,
    `Folie 6 – Materialbeispiele: ${d.p5.f6||'–'}`,
    '',hr,
    'PHASE 6 – AUFGABENVERTEILUNG',
    `Was fehlt: ${d.p6.fehlt||'–'}`,
    `Materialien: ${d.p6.mat||'–'}`,
    `Sprecher:innen: ${d.p6.wer||'–'}`,
    `Deadline: ${d.p6.dl ? new Date(d.p6.dl+'T12:00:00').toLocaleDateString('de-DE') : '–'}`,
  ].join('\n');

  navigator.clipboard.writeText(t).then(() => {
    const b = ge('btn-copy');
    if (b) { b.textContent = '✅ Kopiert!'; setTimeout(()=>b.textContent='📋 Text kopieren',2500); }
  }).catch(() => alert('Kopieren nicht möglich – bitte manuell aus der Vorschau kopieren.'));
};

window.doReset = function() {
  if (confirm('Alle Eingaben unwiderruflich löschen und neu starten?')) {
    localStorage.removeItem(SK);
    location.reload();
  }
};

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
function init() {
  updateNav();
  timerSet(PHASES[S.cur].secs);
  render();
  if (S.pres) {
    document.body.classList.add('pres');
    ge('btn-pres').textContent = '✏️ Bearbeitungsmodus';
    ge('btn-pres').style.background = 'var(--col-rust-dark)';
  }
}

init();
</script>
</body>
</html>
